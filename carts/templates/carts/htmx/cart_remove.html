{% load format_tags %}

{% if empty %}
    <div id="order-container" hx-swap-oob="true" class="text-center">
        <h1 class="mb-4">ваш заказ:</h1>
        <div class="fs-3 fw-bold text-secondary">Корзина пуста.</div>
    </div>
    
    <span id="goods-in-cart-count" hx-swap-oob="true">0</span>
    
{% else %}
    <span id="goods-in-cart-count" hx-swap-oob="true">{{ total_quantity }}</span>
    <span id="cart-total-price" hx-swap-oob="true">{{ total_price|format_price }}</span>
    <div id="cart-item-{{ cart_id }}" hx-swap-oob="true"></div>
{% endif %}
