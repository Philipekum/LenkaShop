<form
    method="post"
    hx-post="{% url 'orders:order' %}"
    hx-target="#order-status"
    hx-swap="innerHTML"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
    class="order-form"
>
    {{ form.non_field_errors }}

    <div class="form-group">
        <label for="{{ form.full_name.id_for_label }}" class="from-label">ФИО:</label>
        {{ form.full_name }}
        {{ form.full_name.errors }}
    </div>

    <div class="form-group">
        <label for="{{ form.phone_number.id_for_label }}" class="form-label">Телефон:</label>
        {{ form.phone_number }}
        {{ form.phone_number.errors }}
    </div>

    <div class="form-group">
        <label for="{{ form.email.id_for_label }}" class="form-label">E-mail:</label>
        {{ form.email }}
        {{ form.email.errors }}
    </div>

    <!-- <div class="form-group">
        <label class="form-label">Город:</label>
        <input 
            type="text" 
            name="city-search"
            class="form-input"
            hx-get="/new-site/order/delivery/"
            hx-trigger="keyup changed delay:300ms, focus"
            hx-target="#city-suggestions"
            hx-swap="innerHTML"
            autocomplete="off"
            placeholder="Введите город"
        >
        <div id="city-suggestions" class="city-suggestions"></div>
        <div id="delivery-price"></div>
    </div> -->
    <div class="form-group">
        <label for="{{ form.delivery_service.id_for_label }}" class="form-label">Служба доставки:</label>
        <div>
            {{ form.delivery_service }}
            {{ form.delivery_service.errors }}
        </div>
    </div>

    <div class="form-group">
        <label for="{{ form.delivery_address.id_for_label }}" class="form-label">Адрес доставки:</label>
        {{ form.delivery_address }}
        {{ form.delivery_address.errors }}
    </div>

    <div class="form-group form-buttons">
        <button type="submit" class="btn add2cart_btn">Оформить заказ</button>
    </div>
</form>
